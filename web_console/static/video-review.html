<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>動画を確認</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0f14;color:#f4f6f8}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0b0f14}.wrap{max-width:820px;margin:auto;padding:24px 18px calc(48px + env(safe-area-inset-bottom))}
a{color:#ffc84a}.panel{background:#151c25;border:1px solid #334258;border-radius:18px;padding:18px;margin:16px 0}h1{font-size:30px;margin:8px 0 18px}p{line-height:1.6;color:#c7cfda}.video-box{background:#000;border-radius:14px;overflow:hidden;min-height:210px;display:grid;place-items:center}video{display:none;width:100%;max-height:65dvh;background:#000}.status{padding:28px 16px;text-align:center;color:#c7cfda}.actions{display:grid;gap:12px;margin-top:18px}.button{display:block;width:100%;border:0;border-radius:14px;padding:17px 16px;text-align:center;text-decoration:none;font-size:18px;font-weight:800;background:#ffc84a;color:#17120a;cursor:pointer;touch-action:manipulation}.button.secondary{background:#29384e;color:#fff}.button[hidden]{display:none}.button.busy{opacity:.65;pointer-events:none}.error{color:#ff8b8b;white-space:pre-wrap}.meta{font-size:14px;color:#9da9b8;overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="wrap">
  <a id="back" href="output.html">← 書き出し画面へ戻る</a>
  <section class="panel">
    <h1 id="title">動画を読み込んでいます</h1>
    <div class="video-box">
      <div id="status" class="status">動画データを取得しています…</div>
      <video id="player" controls playsinline preload="metadata"></video>
    </div>
    <p id="message">読み込み完了後、この画面内で再生できます。</p>
    <p id="meta" class="meta"></p>
    <div class="actions">
      <button id="finalAction" class="button" type="button" hidden>問題なし・最終版を書き出す</button>
      <a id="composeAction" class="button secondary">構成を修正する</a>
    </div>
  </section>
</main>
<script>
(async()=>{
  const params=new URLSearchParams(location.search);
  const project=params.get('project')||'';
  const mode=params.get('mode')==='final'?'final':'preview';
  const encoded=encodeURIComponent(project);
  const appRoot=new URL('../',location.href);
  const apiUrl=path=>new URL(String(path).replace(/^\/+/,''),appRoot).toString();
  const $=s=>document.querySelector(s);
  const outputUrl=`output.html?project=${encoded}&completed=${mode}`;
  $('#back').href=outputUrl;
  $('#composeAction').href=`../?project=${encoded}`;
  if(mode==='preview'){
    $('#title').textContent='プレビューを確認';
    const finalAction=$('#finalAction');
    finalAction.hidden=false;
    const startFinal=event=>{
      event.preventDefault();
      if(finalAction.classList.contains('busy')) return;
      finalAction.classList.add('busy');
      finalAction.textContent='最終版の書き出し画面へ移動しています…';
      window.location.assign(`output.html?project=${encoded}&completed=preview&action=final`);
    };
    finalAction.addEventListener('click',startFinal);
    finalAction.addEventListener('touchend',startFinal,{passive:false});
  }else{
    $('#title').textContent='最終版を確認';
    $('#message').textContent='内容を確認後、書き出し画面から保存できます。';
  }
  const source=mode==='preview'
    ? apiUrl(`api/output-file/${encoded}/preview.mp4`)
    : apiUrl(`api/download/${encoded}`);
  try{
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok) throw new Error(`動画取得失敗: HTTP ${response.status}`);
    const blob=await response.blob();
    if(!blob.size) throw new Error('動画データが空です');
    const objectUrl=URL.createObjectURL(blob);
    const player=$('#player');
    player.src=objectUrl;
    player.style.display='block';
    $('#status').remove();
    $('#meta').textContent=`${(blob.size/1024/1024).toFixed(1)} MB`;
    player.addEventListener('error',()=>{
      $('#message').className='error';
      $('#message').textContent='動画を再生できませんでした。書き出し画面へ戻り、状態を読み込み直してください。';
    });
    window.addEventListener('pagehide',()=>URL.revokeObjectURL(objectUrl),{once:true});
  }catch(error){
    $('#status').className='status error';
    $('#status').textContent=error?.message||String(error);
    $('#message').textContent='書き出し画面へ戻って状態を読み込み直してください。';
  }
})();
</script>
</body>
</html>
