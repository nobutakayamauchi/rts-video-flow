<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>新しいVlog</title>
<style>
:root{--bg:#0b0f14;--panel:#151c25;--line:#2b3848;--ink:#f7f7f7;--muted:#aeb9c5;--gold:#ffc84a;--red:#ff6b63;--blue:#253245;--green:#66d19e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 15px 90px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}.hidden{display:none!important}h1{font-size:1.6rem}.lead,.hint,.meta{color:var(--muted);line-height:1.65}label{display:block;font-weight:800;margin:10px 0 6px}input,select,textarea,button,a.button{width:100%;font:inherit;border-radius:12px;padding:13px}input,select,textarea{background:#0d131b;color:#fff;border:1px solid #3a4b60}textarea{min-height:85px}button,a.button{display:block;border:0;background:var(--gold);color:#17120a;font-weight:900;text-align:center;text-decoration:none;margin-top:9px}.secondary{background:var(--blue)!important;color:#fff!important}.danger{background:var(--red)!important;color:#210b09!important}.ghost{background:transparent!important;color:#fff!important;border:1px solid var(--line)!important}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}video,img{width:100%;max-height:52vh;object-fit:contain;background:#000;border-radius:14px}.status{white-space:pre-wrap;line-height:1.6}.timeline{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:12px;padding:10px;background:#0d131b}.item strong{color:var(--gold)}button:disabled{opacity:.45}.recording{animation:pulse 1s infinite}.camera-safety{position:sticky;top:8px;z-index:20;border:3px solid #ff3b30;background:#2b0d0b;border-radius:16px;padding:12px;margin:12px 0;box-shadow:0 0 0 4px rgba(255,59,48,.18)}.camera-safety-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.camera-safety-title{font-weight:950;font-size:1.08rem}.camera-dot{width:15px;height:15px;border-radius:50%;background:#ff3b30;box-shadow:0 0 0 5px rgba(255,59,48,.22);animation:pulse 1s infinite;flex:none}.camera-elapsed{font-variant-numeric:tabular-nums;font-weight:900}.camera-note{margin:8px 0 0;color:#ffd8d5;line-height:1.5}.camera-safety button{margin-top:10px}.privacy-note{border-left:4px solid var(--gold);padding-left:10px;color:#ffe7a8;line-height:1.6}@keyframes pulse{50%{opacity:.48}}@media(max-width:430px){.row{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<h1>新しいVlog</h1>
<p class="lead">インカメ、アウトカメ、保存済みファイルから素材を追加します。保存後、その素材の後入れ音声と表示時間を設定します。</p>
<p><a href="./" style="color:#ffc84a">既存プロジェクト画面へ</a></p>

<section id="projectPanel" class="panel">
<h2>1. プロジェクト</h2>
<label for="project">プロジェクト名</label>
<input id="project" value="vlog-001" autocomplete="off">
<button id="begin">新規作成して始める</button>
<p id="projectStatus" class="status">待機中</p>
</section>

<section id="materialPanel" class="panel hidden">
<h2>2. 素材を追加</h2>
<p id="projectName" class="meta"></p>
<label for="role">素材の種類</label>
<select id="role">
<option value="opening">オープニング動画</option>
<option value="screen">画面収録</option>
<option value="screenshot">画像・スクリーンショット</option>
<option value="camera">通常動画</option>
<option value="ending">エンディング動画</option>
</select>

<label for="fileInput">保存済みファイルを選ぶ</label>
<input id="fileInput" type="file" accept="video/*,image/*">
<video id="preview" class="hidden" controls playsinline></video>
<img id="imagePreview" class="hidden" alt="選択画像">

<div id="cameraArea">
<p class="privacy-note">このアプリは撮影を隠す機能を提供しません。カメラ起動・録画開始・録画終了時に消せない合図音を鳴らし、カメラ使用中は赤い表示を出します。</p>
<div id="cameraSafety" class="camera-safety hidden" role="status" aria-live="assertive">
<div class="camera-safety-head">
<span class="camera-dot" aria-hidden="true"></span>
<span id="cameraSafetyTitle" class="camera-safety-title">カメラ使用中</span>
<span id="cameraElapsed" class="camera-elapsed">00:00</span>
</div>
<p id="cameraSafetyDetail" class="camera-note">撮影機能が動作しています。この表示は消せません。</p>
<button id="endCamera" class="danger">カメラを終了</button>
</div>
<div class="row">
<button id="frontCamera" class="secondary">インカメを起動</button>
<button id="rearCamera" class="secondary">アウトカメを起動</button>
</div>
<div class="row">
<button id="startRecord" disabled>録画開始</button>
<button id="stopRecord" class="danger" disabled>録画停止</button>
</div>
</div>

<div id="screenHelp" class="hidden hint">iPhoneのコントロールセンターで画面収録し、保存後に上のファイル選択から追加してください。</div>
<div id="descriptionBox" class="hidden">
<label for="description">画像の説明（任意）</label>
<textarea id="description" placeholder="この画像で何を伝えるか"></textarea>
</div>
<button id="save" disabled>この素材をサーバーへ保存</button>
<p id="materialStatus" class="status">素材を選択または撮影してください。</p>
</section>

<section id="existingPanel" class="panel hidden">
<h2>登録済み素材</h2>
<div id="timeline" class="timeline"></div>
<a id="composition" class="button secondary">構成画面へ戻る</a>
</section>
</main>
<script>
const $=selector=>document.querySelector(selector);
const APP_ROOT=new URL('./',location.href);
const apiUrl=path=>new URL(String(path).replace(/^\/+/,''),APP_ROOT).toString();
const labels={opening:'オープニング',ending:'エンディング',screen:'画面収録',screenshot:'画像',camera:'通常動画'};
const state={project:'',timeline:[],blob:null,blobName:'',stream:null,recorder:null,chunks:[],cameraFacing:'',cameraStartedAt:0,cameraTimer:null,audioContext:null,suppressStopSignal:false};
function status(id,text){$(id).textContent=text}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function bestVideoMime(){return ['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(type=>window.MediaRecorder&&MediaRecorder.isTypeSupported?.(type))||''}
function extension(type){const value=(type||'').toLowerCase();if(value.includes('mp4'))return '.mp4';if(value.includes('webm'))return '.webm';return '.mov'}
function formatElapsed(seconds){const value=Math.max(0,Math.floor(seconds));return `${String(Math.floor(value/60)).padStart(2,'0')}:${String(value%60).padStart(2,'0')}`}
async function requestJson(path,options={}){let response;try{response=await fetch(apiUrl(path),options)}catch(error){throw new Error('通信失敗: '+error.message)}const text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={detail:text||`HTTP ${response.status}`}}if(!response.ok)throw new Error(data.detail||`HTTP ${response.status}`);return data}
function uploadForm(path,body,onProgress){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST',apiUrl(path));xhr.upload.onprogress=event=>{if(event.lengthComputable)onProgress?.(Math.round(event.loaded/event.total*100))};xhr.onerror=()=>reject(new Error('アップロード通信に失敗しました'));xhr.onload=()=>{let data={};try{data=xhr.responseText?JSON.parse(xhr.responseText):{}}catch{data={detail:xhr.responseText||`HTTP ${xhr.status}`}}if(xhr.status<200||xhr.status>=300){reject(new Error(data.detail||`HTTP ${xhr.status}`));return}resolve(data)};xhr.timeout=60*60*1000;xhr.ontimeout=()=>reject(new Error('アップロードがタイムアウトしました'));xhr.send(body)})}
function clearCameraTimer(){if(state.cameraTimer){clearInterval(state.cameraTimer);state.cameraTimer=null}}
function updateCameraSafety(recording=false){if(!state.stream){$('#cameraSafety').classList.add('hidden');clearCameraTimer();return}$('#cameraSafety').classList.remove('hidden');$('#cameraSafetyTitle').textContent=recording?'録画中':'カメラ使用中';$('#cameraSafetyDetail').textContent=`${state.cameraFacing==='user'?'インカメ':'アウトカメ'}が動作しています。この表示と合図音は無効化できません。`;const update=()=>{$('#cameraElapsed').textContent=formatElapsed((Date.now()-state.cameraStartedAt)/1000)};update();clearCameraTimer();state.cameraTimer=setInterval(update,500)}
function stopTracksOnly(){if(state.stream){state.stream.getTracks().forEach(track=>track.stop());state.stream=null}state.cameraFacing='';state.cameraStartedAt=0;clearCameraTimer();$('#cameraSafety').classList.add('hidden');$('#startRecord').disabled=true;$('#stopRecord').disabled=true;$('#frontCamera').disabled=false;$('#rearCamera').disabled=false;$('#endCamera').disabled=false}
function resetPreview(){state.blob=null;state.blobName='';$('#fileInput').value='';$('#preview').pause();$('#preview').removeAttribute('src');$('#preview').srcObject=null;$('#preview').classList.add('hidden');$('#imagePreview').removeAttribute('src');$('#imagePreview').classList.add('hidden');$('#save').disabled=true}
async function playPrivacySignal(kind){const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)throw new Error('このブラウザでは必須の撮影合図音を再生できません');if(!state.audioContext||state.audioContext.state==='closed')state.audioContext=new AudioContextClass();await state.audioContext.resume();if(state.audioContext.state!=='running')throw new Error('撮影合図音を開始できません');const patterns={cameraOpen:[[660,.12],[0,.08],[880,.12]],recordStart:[[880,.11],[660,.11]],recordStop:[[660,.11],[880,.11]],cameraClose:[[520,.12],[390,.15]]};const pattern=patterns[kind];if(!pattern)throw new Error('不明な撮影合図音です');let cursor=state.audioContext.currentTime+.03;for(const [frequency,duration] of pattern){if(!frequency){cursor+=duration;continue}const oscillator=state.audioContext.createOscillator();const gain=state.audioContext.createGain();oscillator.type='sine';oscillator.frequency.setValueAtTime(frequency,cursor);gain.gain.setValueAtTime(.0001,cursor);gain.gain.exponentialRampToValueAtTime(.18,cursor+.015);gain.gain.setValueAtTime(.18,Math.max(cursor+.02,cursor+duration-.025));gain.gain.exponentialRampToValueAtTime(.0001,cursor+duration);oscillator.connect(gain);gain.connect(state.audioContext.destination);oscillator.start(cursor);oscillator.stop(cursor+duration+.01);cursor+=duration+.045}await wait(Math.max(80,(cursor-state.audioContext.currentTime+.03)*1000));if(state.audioContext.state!=='running')throw new Error('撮影合図音の再生処理が中断されました')}
async function closeCamera({signal=true,message='カメラを終了しました'}={}){if(state.recorder&&state.recorder.state!=='inactive'){state.suppressStopSignal=!signal;state.recorder.stop();return}const hadStream=Boolean(state.stream);stopTracksOnly();$('#preview').srcObject=null;if(hadStream&&signal){try{await playPrivacySignal('cameraClose')}catch(error){status('#materialStatus',`${message}\n終了音エラー: ${error.message}`);return}}if(hadStream)status('#materialStatus',message)}
function emergencyStopCamera(message){state.suppressStopSignal=true;if(state.recorder&&state.recorder.state!=='inactive'){try{state.recorder.stop()}catch{}}stopTracksOnly();$('#preview').srcObject=null;status('#materialStatus',message)}
function renderTimeline(){const box=$('#timeline');box.innerHTML=state.timeline.length?state.timeline.map((item,index)=>`<div class="item"><strong>${index+1}. ${labels[item.role]||item.role}</strong><div class="meta">${item.source||''}${item.narration?' / 後入れ音声あり':''}</div></div>`).join(''):'<p class="hint">まだ素材はありません。</p>'}
function chooseDefaultRole(){return state.timeline.some(item=>item.role==='opening')?'screen':'opening'}
async function showMaterial(){resetPreview();$('#projectPanel').classList.add('hidden');$('#materialPanel').classList.remove('hidden');$('#existingPanel').classList.remove('hidden');$('#projectName').textContent=`プロジェクト：${state.project}`;$('#composition').href=`./?project=${encodeURIComponent(state.project)}`;$('#role').value=chooseDefaultRole();await updateRole();renderTimeline()}
async function loadProject(){const data=await requestJson(`api/project/${encodeURIComponent(state.project)}`,{cache:'no-store'});state.timeline=data.timeline||[]}
async function begin(){state.project=$('#project').value.trim();if(!state.project)return;status('#projectStatus','準備中…');const body=new FormData();body.append('project',state.project);try{const created=await requestJson('api/project',{method:'POST',body});state.project=created.project;$('#project').value=state.project;state.timeline=[];await showMaterial();status('#projectStatus','新規作成しました。')}catch(error){if(String(error.message).includes('既にあります')){try{await loadProject();await showMaterial();status('#projectStatus','既存プロジェクトを開きました。')}catch(loadError){status('#projectStatus','読込失敗: '+loadError.message)}}else{status('#projectStatus','作成失敗: '+error.message)}}}
async function updateRole(){if(state.stream)await closeCamera({signal:true,message:'素材種別を変更したためカメラを終了しました'});const role=$('#role').value;const image=role==='screenshot';const screen=role==='screen';$('#cameraArea').classList.toggle('hidden',image||screen);$('#screenHelp').classList.toggle('hidden',!screen);$('#descriptionBox').classList.toggle('hidden',!image);resetPreview();status('#materialStatus','素材を選択または撮影してください。')}
async function startCamera(facing){if(state.recorder&&state.recorder.state!=='inactive'){status('#materialStatus','録画中はカメラを切り替えられません');return}$('#frontCamera').disabled=true;$('#rearCamera').disabled=true;$('#startRecord').disabled=true;try{if(state.stream)await closeCamera({signal:true,message:'カメラを切り替えます'});status('#materialStatus','カメラ起動音を再生しています…');await playPrivacySignal('cameraOpen');status('#materialStatus','カメラ権限を確認しています…');const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:true});state.stream=stream;state.cameraFacing=facing;state.cameraStartedAt=Date.now();const videoTrack=stream.getVideoTracks()[0];videoTrack?.addEventListener('ended',()=>{if(state.stream)emergencyStopCamera('端末側でカメラが終了しました。自動再開はしません。')},{once:true});$('#preview').classList.remove('hidden');$('#preview').srcObject=stream;$('#preview').muted=true;$('#preview').controls=false;await $('#preview').play();$('#startRecord').disabled=false;updateCameraSafety(false);status('#materialStatus',`${facing==='user'?'インカメ':'アウトカメ'}起動済み。録画開始時にも合図音が鳴ります。`)}catch(error){stopTracksOnly();$('#preview').srcObject=null;$('#preview').classList.add('hidden');status('#materialStatus','カメラ起動失敗: '+error.message)}finally{$('#frontCamera').disabled=false;$('#rearCamera').disabled=false}}
async function record(){if(!state.stream){status('#materialStatus','先にインカメまたはアウトカメを起動してください');return}const mime=bestVideoMime();state.chunks=[];$('#startRecord').disabled=true;$('#frontCamera').disabled=true;$('#rearCamera').disabled=true;try{status('#materialStatus','録画開始音を再生しています…');await playPrivacySignal('recordStart');state.recorder=new MediaRecorder(state.stream,mime?{mimeType:mime}:undefined)}catch(error){status('#materialStatus','録画開始失敗: '+error.message);$('#startRecord').disabled=false;$('#frontCamera').disabled=false;$('#rearCamera').disabled=false;return}state.recorder.ondataavailable=event=>{if(event.data?.size)state.chunks.push(event.data)};state.recorder.onstop=async()=>{const recorder=state.recorder;const type=recorder?.mimeType||mime||'video/webm';state.blob=new Blob(state.chunks,{type});state.blobName=`capture${extension(type)}`;$('#preview').srcObject=null;$('#preview').src=URL.createObjectURL(state.blob);$('#preview').muted=false;$('#preview').controls=true;$('#save').disabled=false;stopTracksOnly();$('#startRecord').classList.remove('recording');const suppress=state.suppressStopSignal;state.suppressStopSignal=false;if(!suppress){try{await playPrivacySignal('recordStop');status('#materialStatus',`録画完了 ${(state.blob.size/1024/1024).toFixed(1)} MB`)}catch(error){status('#materialStatus',`録画完了 ${(state.blob.size/1024/1024).toFixed(1)} MB\n終了音エラー: ${error.message}`)}}else{status('#materialStatus',`録画を安全停止しました ${(state.blob.size/1024/1024).toFixed(1)} MB`)} };state.recorder.start(500);$('#startRecord').classList.add('recording');$('#stopRecord').disabled=false;$('#endCamera').disabled=false;updateCameraSafety(true);status('#materialStatus','録画中…')}
$('#begin').onclick=begin;
$('#role').onchange=updateRole;
$('#fileInput').onchange=async()=>{const file=$('#fileInput').files?.[0];if(!file)return;if(state.stream)await closeCamera({signal:true,message:'保存済みファイルを選択したためカメラを終了しました'});resetPreview();state.blob=file;state.blobName=file.name;$('#save').disabled=false;if(file.type.startsWith('image/')){$('#imagePreview').src=URL.createObjectURL(file);$('#imagePreview').classList.remove('hidden')}else{$('#preview').src=URL.createObjectURL(file);$('#preview').muted=false;$('#preview').controls=true;$('#preview').classList.remove('hidden')}status('#materialStatus',`選択済み：${file.name} (${(file.size/1024/1024).toFixed(1)} MB)`) };
$('#frontCamera').onclick=()=>startCamera('user');
$('#rearCamera').onclick=()=>startCamera('environment');
$('#startRecord').onclick=record;
$('#stopRecord').onclick=()=>{if(state.recorder&&state.recorder.state!=='inactive'){state.suppressStopSignal=false;state.recorder.stop()}};
$('#endCamera').onclick=()=>closeCamera({signal:true,message:'カメラを終了しました'});
$('#save').onclick=async()=>{if(!state.blob)return;const body=new FormData();body.append('project',state.project);body.append('role',$('#role').value);body.append('description',$('#description').value);body.append('media',state.blob,state.blobName||'material.bin');$('#save').disabled=true;status('#materialStatus','保存中…');try{const data=await uploadForm('api/material',body,percent=>status('#materialStatus',`保存中… ${percent}%`));state.timeline=data.timeline||[];const item=data.item;location.href=`static/timed-narration.html?project=${encodeURIComponent(state.project)}&item=${encodeURIComponent(item.id)}`}catch(error){status('#materialStatus','保存失敗: '+error.message);$('#save').disabled=false}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state.stream||(state.recorder&&state.recorder.state!=='inactive')))emergencyStopCamera('画面が非表示になったため、カメラと録画を停止しました。自動再開はしません。')});
window.addEventListener('pagehide',()=>{if(state.stream||(state.recorder&&state.recorder.state!=='inactive'))emergencyStopCamera('ページを離れたため撮影を停止しました。')});
window.addEventListener('beforeunload',()=>{if(state.stream||(state.recorder&&state.recorder.state!=='inactive'))emergencyStopCamera('ページを離れたため撮影を停止しました。')});
const query=new URLSearchParams(location.search).get('project');if(query){$('#project').value=query;state.project=query;loadProject().then(showMaterial).catch(()=>{})}
</script>
</body>
</html>
