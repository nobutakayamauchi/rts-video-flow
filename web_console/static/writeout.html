<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>限界開発 Vlog 書き出し</title>
<style>
:root{--bg:#0b0f14;--panel:#151c25;--line:#2b3848;--ink:#f7f7f7;--muted:#aeb9c5;--gold:#ffc84a;--blue:#253245;--green:#66d19e;--red:#ff6b63}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:680px;margin:auto;padding:22px 16px 90px}h1{font-size:1.7rem;margin:.3em 0}.lead,.hint{color:var(--muted);line-height:1.65}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:15px 0}label{display:block;font-weight:800;margin:10px 0 6px}input,button,a{width:100%;font:inherit;border-radius:12px;padding:14px}input{background:#0d131b;color:#fff;border:1px solid #3a4b60}button{border:0;background:var(--gold);color:#17120a;font-weight:900;margin-top:10px}button:disabled{opacity:.5}.secondary{display:block;text-align:center;text-decoration:none;background:var(--blue);color:#fff;font-weight:900;margin-top:10px}.download{display:block;text-align:center;text-decoration:none;background:var(--green);color:#07150e;font-weight:900;margin-top:10px}.status{white-space:pre-wrap;color:#d6dee7;line-height:1.6}.warning{color:#ffd479}.hidden{display:none!important}a.back{color:var(--gold)}
</style>
</head>
<body><main class="wrap">
<h1>Vlog書き出し</h1>
<p class="lead">素材管理で保存した音声・範囲差し替えを反映し、動画を書き出します。</p>
<p><a id="back" class="back" href="manage.html">素材管理へ戻る</a></p>
<section class="panel">
<label for="project">プロジェクト名</label>
<input id="project" value="vlog-001" autocomplete="off">
<button id="render">変更を反映して動画を書き出す</button>
<p id="status" class="status">待機中</p>
<a id="download" class="download hidden" target="_blank">完成動画を開く</a>
<a id="manage" class="secondary">素材管理へ戻る</a>
</section>
<section class="panel">
<p class="warning">書き出し中は画面を閉じずに待ってください。素材量によって数分かかります。</p>
<p class="hint">この操作は動画を生成しますが、自動公開は行いません。</p>
</section>
</main>
<script>
const $=selector=>document.querySelector(selector);
const APP_ROOT=new URL('../',location.href);
const apiUrl=path=>new URL(String(path).replace(/^\/+/,''),APP_ROOT).toString();
function projectName(){return $('#project').value.trim()}
function setStatus(message){$('#status').textContent=message}
function updateLinks(){
  const name=projectName();
  $('#manage').href='manage.html?project='+encodeURIComponent(name);
  $('#back').href='manage.html?project='+encodeURIComponent(name);
  $('#download').href=apiUrl('api/download/'+encodeURIComponent(name));
}
async function requestJson(path,options={}){
  let response;
  try{response=await fetch(apiUrl(path),options)}catch(error){throw new Error('通信失敗: '+error.message)}
  const text=await response.text();
  let data={};
  try{data=text?JSON.parse(text):{}}catch{data={detail:text.slice(0,1000)||`HTTP ${response.status}`}}
  if(!response.ok)throw new Error(data.detail||`HTTP ${response.status}`);
  return data;
}
async function render(){
  const name=projectName();
  if(!name){setStatus('プロジェクト名を入力してください。');return}
  updateLinks();
  const button=$('#render');button.disabled=true;$('#download').classList.add('hidden');
  setStatus('変更を反映して動画を書き出しています。画面を閉じずにお待ちください…');
  const body=new FormData();body.append('project',name);body.append('render','true');
  try{
    const data=await requestJson('api/compile',{method:'POST',body});
    if(data.status!=='rendered')throw new Error('書き出し完了を確認できませんでした。');
    setStatus('書き出しが完了しました。下のボタンから再生してください。\n'+(data.output||''));
    $('#download').classList.remove('hidden');
  }catch(error){setStatus('書き出し失敗:\n'+error.message)}finally{button.disabled=false}
}
$('#render').onclick=render;
$('#project').oninput=updateLinks;
const params=new URLSearchParams(location.search);if(params.get('project'))$('#project').value=params.get('project');
updateLinks();
</script>
</body>
</html>
