name: HTTP2Shell runtime check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=22.23.4 <23'
          check-latest: true
      - name: Verify patched runtime and Brotli round trip
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { brotliCompressSync, brotliDecompressSync } from 'node:zlib';
          const [major, minor, patch] = process.versions.node.split('.').map(Number);
          assert(major === 22 && (minor > 23 || (minor === 23 && patch >= 4)), 'Unpatched or unexpected Node.js runtime');
          const input = Buffer.from('HTTP2Shell remediation smoke test');
          assert.deepEqual(brotliDecompressSync(brotliCompressSync(input)), input);
          console.log(JSON.stringify({node: process.versions.node, brotli: process.versions.brotli, executable: process.execPath}));
          JS
      - name: Verify existing Remotion dependencies load on Node 22
        working-directory: remotion-project
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { VERSION } from 'remotion';
          import React from 'react';
          assert.equal(VERSION, '4.0.366');
          assert.equal(React.version, '18.3.1');
          console.log(JSON.stringify({remotion: VERSION, react: React.version}));
          JS
